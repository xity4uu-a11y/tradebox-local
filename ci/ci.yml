# Reference CI pipeline for tradebox-local.
# Copy to .github/workflows/ci.yml if you want automated GitHub Actions runs on your fork.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test-and-build:
    name: Go Vet, Unit Tests, and Cross-Compile
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Run full test suite
        run: go test -v -count=1 ./...

      - name: Cross-compile static release binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/tradebox-windows-amd64.exe ./cmd/tradebox
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/tradebox-linux-amd64 ./cmd/tradebox
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/tradebox-darwin-arm64 ./cmd/tradebox
          cd dist && sha256sum tradebox-* > SHA256SUMS.txt

  plugin-validation:
    name: Validate Community Plugins & Node Initializer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate plugin manifests against schema
        run: node scripts/validate-plugins.mjs

      - name: Smoke-test Node initializer dry-run
        run: |
          node bin/create-tradebox-local.mjs --version
          node bin/create-tradebox-local.mjs --dry-run
